# Perfil DEMO: H2 en memoria + datos ficticios. No requiere PostgreSQL ni servicios externos.
# Activarlo con: ./gradlew bootRun --args='--spring.profiles.active=demo'
spring:
  datasource:
    url: jdbc:h2:mem:consultorio_demo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 1025

server:
  port: ${APP_PORT:8080}

app:
  demo-seed:
    enabled: true
