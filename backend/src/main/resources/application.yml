spring:
  application:
    name: consultorio-odontologico
  datasource:
    url: ${DB_URL:jdbc:h2:mem:consultorio;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:create-drop}
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

server:
  port: ${APP_PORT:8080}

smtp:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:1025}
  user: ${SMTP_USER:}
  password: ${SMTP_PASSWORD:}

mailpit:
  host: ${MAILPIT_HOST:localhost}
  port: ${MAILPIT_PORT:1025}

app:
  frontend-path: ${FRONTEND_PATH:src/main/resources/static}
