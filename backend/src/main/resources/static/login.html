<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Pacientes — Consultorio Odontológico</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --secondary: #0f172a;
      --accent: #10b981;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #334155;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.5; }
    .container { max-width: 480px; margin: 0 auto; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { color: var(--secondary); font-size: 1.4rem; margin-bottom: 0.35rem; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .tab-btn { flex: 1; padding: 0.55rem; border: 1px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; font-weight: 600; color: var(--text-muted); }
    .tab-btn.active { background: #e0f2fe; color: var(--primary-dark); border-color: #bae6fd; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--secondary); }
    input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; margin-bottom: 0.9rem; }
    input:focus { outline: none; border-color: var(--primary); }
    .btn { width: 100%; padding: 0.7rem; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #475569; margin-top: 0.5rem; }
    .alert { padding: 0.7rem 0.9rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1rem; display: none; }
    .alert.error { display: block; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert.success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .hidden { display: none; }
    .profile-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; font-size: 0.9rem; }
    .gmail-banner { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .gmail-banner h3 { font-size: 1rem; color: var(--primary-dark); margin-bottom: 0.35rem; }
    .gmail-banner p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="/index.html">← Volver al inicio</a>

    <div class="card">
      <h1>🦷 Portal de Pacientes</h1>
      <p class="subtitle">Ingresá con tu DNI y contraseña o creá tu cuenta.</p>

      <div id="alert-box" class="alert"></div>

      <div id="auth-section">
        <div class="tabs">
          <button type="button" id="tab-login" class="tab-btn active">Iniciar sesión</button>
          <button type="button" id="tab-register" class="tab-btn">Registrarme</button>
        </div>

        <form id="login-form">
          <label for="login-dni">DNI (7 u 8 dígitos)</label>
          <input id="login-dni" type="text" inputmode="numeric" pattern="\d{7,8}" placeholder="Ej: 99999999" required>

          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" placeholder="Tu contraseña" required>

          <button type="submit" class="btn">Ingresar</button>
        </form>

        <form id="register-form" class="hidden">
          <label for="reg-name">Nombre completo</label>
          <input id="reg-name" type="text" minlength="2" placeholder="Ej: Juan Pérez" required>

          <label for="reg-dni">DNI (7 u 8 dígitos)</label>
          <input id="reg-dni" type="text" inputmode="numeric" pattern="\d{7,8}" placeholder="Ej: 99999999" required>

          <label for="reg-password">Contraseña (mínimo 6 caracteres)</label>
          <input id="reg-password" type="password" minlength="6" placeholder="Creá una contraseña" required>

          <button type="submit" class="btn">Crear cuenta</button>
        </form>
      </div>

      <div id="profile-section" class="hidden">
        <div class="profile-box">
          <p><strong>Paciente:</strong> <span id="prof-name"></span></p>
          <p><strong>DNI:</strong> <span id="prof-dni"></span></p>
          <p><strong>Gmail de recuperación:</strong> <span id="prof-gmail">No vinculado</span></p>
        </div>

        <div id="gmail-link-box" class="gmail-banner hidden">
          <h3>Vincular Gmail de recuperación (única vez)</h3>
          <p>Asociá una cuenta @gmail.com por única vez para recuperar tu acceso o recibir recordatorios.</p>
          <form id="gmail-form">
            <label for="gmail-input">Correo Gmail</label>
            <input id="gmail-input" type="email" placeholder="ejemplo@gmail.com" required>
            <button type="submit" class="btn">Vincular Gmail</button>
          </form>
        </div>

        <button type="button" id="logout-btn" class="btn btn-secondary">Cerrar sesión</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
